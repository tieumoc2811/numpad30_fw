name: Build firmware

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # cần để đính kèm .uf2 vào Release

env:
  FW_DIR: numpad30_fw      # thư mục chứa CMakeLists.txt (đổi nếu bạn để chỗ khác)
  PICO_SDK_VERSION: "2.2.0" # board waveshare_rp2350_zero cần SDK >= 2.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cài toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential python3 \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Cache Pico SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}

      - name: Tải Pico SDK + TinyUSB
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$PICO_SDK_VERSION" \
            https://github.com/raspberrypi/pico-sdk.git pico-sdk
          git -C pico-sdk submodule update --init --depth 1 lib/tinyusb

      - name: Chép pico_sdk_import.cmake (nếu repo chưa có)
        run: |
          if [ ! -f "$FW_DIR/pico_sdk_import.cmake" ]; then
            cp pico-sdk/external/pico_sdk_import.cmake "$FW_DIR/"
          fi

      - name: Configure
        run: |
          cmake -S "$FW_DIR" -B build -G Ninja \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Gom file kết quả
        run: |
          mkdir -p dist
          cp build/numpad30.uf2 build/numpad30.elf build/numpad30.bin dist/
          cp build/numpad30.map dist/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: numpad30-firmware
          path: dist/

      - name: Tạo Release (khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/numpad30.uf2
            dist/numpad30.elf
            dist/numpad30.bin
          generate_release_notes: true
